<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TabFlow</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="popup" aria-live="polite">
      <header>
        <div class="brand">
          <img src="../assets/tabflow-mark.svg" alt="" width="28" height="28" />
          <strong>TabFlow</strong>
        </div>
        <button
          id="settings"
          class="icon-button"
          aria-label="Open settings"
          title="Settings">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path
              d="m9.7 3.4.4-1.1h3.8l.4 1.1 1 .4 1.1-.5 2.7 2.7-.5 1.1.4 1 1.1.4v3.8l-1.1.4-.4 1 .5 1.1-2.7 2.7-1.1-.5-1 .4-.4 1.1h-3.8l-.4-1.1-1-.4-1.1.5-2.7-2.7.5-1.1-.4-1-1.1-.4V8.5l1.1-.4.4-1-.5-1.1 2.7-2.7 1.1.5 1-.4Z"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linejoin="round" />
            <circle
              cx="12"
              cy="10.5"
              r="2.7"
              fill="none"
              stroke="currentColor"
              stroke-width="1.5" />
          </svg>
        </button>
      </header>
      <p class="eyebrow">Your tabs, organised.</p>
      <section id="content" class="content">
        <div class="status-sweep" aria-hidden="true"><span></span></div>
        <p id="summary" class="summary">Checking current window...</p>
        <button id="organize" class="primary" type="button">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18">
            <path
              d="M4 7.5h16M4 12h10M4 16.5h16"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round" />
            <path d="m16 10 4 2.5-4 2.5v-5Z" fill="currentColor" />
          </svg>
          <span>Organise tabs</span>
        </button>
        <p id="supporting" class="supporting">Current window</p>
      </section>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
