<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>CleanMyTabs settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header>
        <a class="back-link" href="../popup/index.html">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16">
            <path
              d="m14.5 5-7 7 7 7M8 12h9"
              fill="none"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
          <span>Back to CleanMyTabs</span>
        </a>
        <p class="kicker">
          <img src="../assets/tabflow-mark.svg" alt="" width="28" height="28" />
          CleanMyTabs
        </p>
        <h1>Settings</h1>
        <p class="lede">Keep organisation predictable and local.</p>
      </header>
      <section>
        <h2>Organisation</h2>
        <label
          ><input type="checkbox" data-key="preserveGroups" checked /> Preserve
          existing groups</label
        ><label
          ><input type="checkbox" data-key="removeDuplicates" checked /> Remove
          duplicates</label
        ><label
          ><input type="checkbox" data-key="groupUngrouped" checked /> Group
          ungrouped tabs</label
        >
      </section>
      <section>
        <h2>Grouping</h2>
        <label
          >Group naming<select data-key="naming">
            <option>Standard</option>
            <option>Simple</option>
          </select></label
        ><label
          >Minimum confidence<select data-key="confidence">
            <option>Conservative</option>
            <option>Balanced</option>
          </select></label
        >
      </section>
      <section>
        <h2>Appearance</h2>
        <label
          >Theme<select data-key="theme">
            <option>System</option>
            <option>Light</option>
            <option>Dark</option>
          </select></label
        >
      </section>
      <section>
        <h2>Privacy</h2>
        <p>
          CleanMyTabs does not collect, upload, or sell your browsing data. Tab
          organisation happens locally in Chrome. No account or CleanMyTabs
          server is required.
        </p>
      </section>
      <p id="saved" role="status" aria-live="polite"></p>
    </main>
    <script src="settings.js"></script>
  </body>
</html>
